<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64">
  <style>.paper{fill:#e4e3df}.ink{fill:#2e2e2d}@media (prefers-color-scheme:dark){.paper{fill:#2a2a2d}.ink{fill:#e8e7e3}}</style>
  <defs><mask id="dots"><image width="64" height="64" href="data:image/png;base64," xlink:href="data:image/png;base64,"/></mask></defs>
  <rect class="paper" width="64" height="64" rx="14"/>
  <rect class="ink" width="64" height="64" mask="url(#dots)"/>
</svg>
